<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 앱 개발 프롬프트 평가 시스템</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Google Fonts: Inter & Noto Sans KR -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', 'Noto Sans KR', sans-serif; background-color: #f8fafc; }
        .glass-panel { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); }
        .loader {
            border: 3px solid #f3f3f3; border-radius: 50%; border-top: 3px solid #3b82f6; width: 24px; height: 24px;
            -webkit-animation: spin 1s linear infinite; animation: spin 1s linear infinite; display: inline-block;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen text-slate-800 p-4 md:p-8">

    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function App() {
            const [promptText, setPromptText] = useState("");
            const [isEvaluating, setIsEvaluating] = useState(false);
            const [result, setResult] = useState(null);
            const [errorMsg, setErrorMsg] = useState("");

            const evaluatePrompt = async () => {
                if (!promptText.trim()) {
                    setErrorMsg("프롬프트를 입력해주세요.");
                    return;
                }

                setIsEvaluating(true);
                setErrorMsg("");
                setResult(null);

                try {
                    // 구글 API 직접 호출 대신 Vercel 서버리스 함수(/api/evaluate) 호출
                    const response = await fetch('/api/evaluate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ promptText })
                    });

                    const parsedResult = await response.json();

                    if (!response.ok) {
                        throw new Error(parsedResult.error || "API 요청에 실패했습니다.");
                    }
                    
                    const safeResult = {
                        totalScore: parsedResult?.totalScore || 0,
                        ideaGeneration: {
                            score: parsedResult?.ideaGeneration?.score || 0,
                            feedback: parsedResult?.ideaGeneration?.feedback || "분석 내용이 누락되었습니다."
                        },
                        goalSetting: {
                            score: parsedResult?.goalSetting?.score || 0,
                            feedback: parsedResult?.goalSetting?.feedback || "분석 내용이 누락되었습니다."
                        },
                        freeSketch: {
                            score: parsedResult?.freeSketch?.score || 0,
                            feedback: parsedResult?.freeSketch?.feedback || "분석 내용이 누락되었습니다."
                        },
                        coreStructure: {
                            totalSubScore: parsedResult?.coreStructure?.totalSubScore || 0,
                            design: {
                                score: parsedResult?.coreStructure?.design?.score || 0,
                                feedback: parsedResult?.coreStructure?.design?.feedback || "분석 내용이 누락되었습니다."
                            },
                            layout: {
                                score: parsedResult?.coreStructure?.layout?.score || 0,
                                feedback: parsedResult?.coreStructure?.layout?.feedback || "분석 내용이 누락되었습니다."
                            },
                            visualObjects: {
                                score: parsedResult?.coreStructure?.visualObjects?.score || 0,
                                feedback: parsedResult?.coreStructure?.visualObjects?.feedback || "분석 내용이 누락되었습니다."
                            },
                            uiux: {
                                score: parsedResult?.coreStructure?.uiux?.score || 0,
                                feedback: parsedResult?.coreStructure?.uiux?.feedback || "분석 내용이 누락되었습니다."
                            },
                            coreLogic: {
                                score: parsedResult?.coreStructure?.coreLogic?.score || 0,
                                feedback: parsedResult?.coreStructure?.coreLogic?.feedback || "분석 내용이 누락되었습니다."
                            }
                        }
                    };
                    
                    setResult(safeResult);
                } catch (err) {
                    setErrorMsg(err.message || "평가 중 오류가 발생했습니다. 다시 시도해주세요.");
                } finally {
                    setIsEvaluating(false);
                }
            };

            return (
                <div className="max-w-5xl mx-auto space-y-8 pb-16">
                    <header className="text-center space-y-3 mt-8">
                        <div className="inline-block bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-sm font-semibold tracking-wide mb-2">
                            AI-Powered Evaluation
                        </div>
                        <h1 className="text-3xl md:text-4xl font-bold text-slate-900 tracking-tight">앱 기획 프롬프트 평가기</h1>
                        <p className="text-slate-500 max-w-2xl mx-auto">
                            작성하신 앱 개발 프롬프트를 입력하시면, 4가지 핵심 기준(아이디어, 목표, 스케치, 구조 체계화)을 분석하여 점수와 피드백을 제공합니다.
                        </p>
                    </header>

                    <section className="bg-white rounded-3xl shadow-sm border border-slate-200 p-6 md:p-8 relative">
                        <label htmlFor="promptInput" className="block text-lg font-semibold text-slate-800 mb-2">
                            프롬프트 입력
                        </label>
                        <p className="text-sm text-slate-500 mb-4">개발하고자 하는 앱에 대한 아이디어, 구조, 디자인, 기능 등을 상세히 적어주세요.</p>
                        
                        <textarea
                            id="promptInput"
                            rows="8"
                            className="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-blue-500/20 focus:border-blue-500 transition-all resize-none outline-none text-slate-700 leading-relaxed"
                            placeholder="예: 일상생활에서 종이 영수증을 관리하기가 너무 불편해서, 카메라로 찍으면 자동으로 가계부에 입력되는 앱을 만들고 싶습니다. 핵심 목표는 지출 관리의 자동화입니다. 디자인은 깔끔한 흰색 바탕에 포인트 컬러는 녹색으로 하고..."
                            value={promptText}
                            onChange={(e) => setPromptText(e.target.value)}
                        ></textarea>

                        <div className="mt-6 flex items-center justify-between">
                            {errorMsg ? <p className="text-red-500 text-sm font-medium">{errorMsg}</p> : <div></div>}
                            
                            <button
                                onClick={evaluatePrompt}
                                disabled={isEvaluating}
                                className={`px-8 py-3.5 rounded-xl text-white font-semibold flex items-center gap-2 transition-all shadow-md
                                    ${isEvaluating ? 'bg-slate-400 cursor-not-allowed' : 'bg-blue-600 hover:bg-blue-700 hover:shadow-lg active:scale-95'}`}
                            >
                                {isEvaluating ? (
                                    <><span className="loader border-white/30 border-t-white"></span> 분석 중...</>
                                ) : (
                                    <>평가 시작하기 🚀</>
                                )}
                            </button>
                        </div>
                    </section>

                    {result && (
                        <section className="space-y-6 animate-[fadeIn_0.5s_ease-out]">
                            <div className="text-center py-8 bg-slate-900 rounded-3xl shadow-lg relative overflow-hidden">
                                <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-pink-500 via-yellow-400 to-green-500"></div>
                                <h2 className="text-xl text-slate-300 mb-2">총 평가 점수</h2>
                                <div className="text-6xl font-extrabold text-white">
                                    {result.totalScore} <span className="text-3xl text-slate-400 font-medium">/ 100</span>
                                </div>
                            </div>

                            <div className="bg-white rounded-3xl p-6 md:p-8 shadow-sm border border-slate-200">
                                <h3 className="text-lg font-bold text-slate-800 mb-6 flex items-center gap-2">
                                    📊 점수 도달 상황
                                </h3>
                                <div className="space-y-5">
                                    <div>
                                        <div className="flex justify-between text-sm font-bold mb-2">
                                            <span className="text-pink-700">1. 아이디어 발굴</span>
                                            <span className="text-pink-900">{result.ideaGeneration.score} / 20</span>
                                        </div>
                                        <div className="w-full bg-pink-100 rounded-full h-4 shadow-inner overflow-hidden">
                                            <div className="bg-pink-500 h-4 rounded-full transition-all duration-1000 ease-out relative" 
                                                 style={{ width: `${Math.max(5, (result.ideaGeneration.score / 20) * 100)}%` }}>
                                                 <div className="absolute inset-0 bg-white/20 w-full animate-[shimmer_2s_infinite]"></div>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div>
                                        <div className="flex justify-between text-sm font-bold mb-2">
                                            <span className="text-amber-700">2. 프로젝트 목표 설정</span>
                                            <span className="text-amber-900">{result.goalSetting.score} / 20</span>
                                        </div>
                                        <div className="w-full bg-amber-100 rounded-full h-4 shadow-inner overflow-hidden">
                                            <div className="bg-amber-500 h-4 rounded-full transition-all duration-1000 ease-out delay-100 relative" 
                                                 style={{ width: `${Math.max(5, (result.goalSetting.score / 20) * 100)}%` }}>
                                                 <div className="absolute inset-0 bg-white/20 w-full animate-[shimmer_2s_infinite]"></div>
                                            </div>
                                        </div>
                                    </div>

                                    <div>
                                        <div className="flex justify-between text-sm font-bold mb-2">
                                            <span className="text-blue-700">3. 자유 아이디어 스케치</span>
                                            <span className="text-blue-900">{result.freeSketch.score} / 10</span>
                                        </div>
                                        <div className="w-full bg-blue-100 rounded-full h-4 shadow-inner overflow-hidden">
                                            <div className="bg-blue-500 h-4 rounded-full transition-all duration-1000 ease-out delay-200 relative" 
                                                 style={{ width: `${Math.max(5, (result.freeSketch.score / 10) * 100)}%` }}>
                                                 <div className="absolute inset-0 bg-white/20 w-full animate-[shimmer_2s_infinite]"></div>
                                            </div>
                                        </div>
                                    </div>

                                    <div>
                                        <div className="flex justify-between text-sm font-bold mb-2">
                                            <span className="text-emerald-700">4. 핵심 구조 체계화</span>
                                            <span className="text-emerald-900">{result.coreStructure.totalSubScore} / 50</span>
                                        </div>
                                        <div className="w-full bg-emerald-100 rounded-full h-4 shadow-inner overflow-hidden">
                                            <div className="bg-emerald-500 h-4 rounded-full transition-all duration-1000 ease-out delay-300 relative" 
                                                 style={{ width: `${Math.max(5, (result.coreStructure.totalSubScore / 50) * 100)}%` }}>
                                                 <div className="absolute inset-0 bg-white/20 w-full animate-[shimmer_2s_infinite]"></div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div className="bg-pink-50 rounded-2xl border border-pink-200 p-6 shadow-sm hover:shadow-md transition-shadow">
                                    <div className="flex justify-between items-start mb-4">
                                        <h3 className="text-lg font-bold text-pink-900 flex items-center gap-2">
                                            <span className="bg-pink-200 text-pink-700 w-6 h-6 flex items-center justify-center rounded-full text-sm">1</span>
                                            아이디어 발굴
                                        </h3>
                                        <div className="bg-pink-600 text-white px-3 py-1 rounded-lg font-bold">
                                            {result.ideaGeneration.score} / 20
                                        </div>
                                    </div>
                                    <p className="text-pink-800 text-sm leading-relaxed bg-white/60 p-4 rounded-xl border border-pink-100">
                                        {result.ideaGeneration.feedback}
                                    </p>
                                </div>

                                <div className="bg-amber-50 rounded-2xl border border-amber-200 p-6 shadow-sm hover:shadow-md transition-shadow">
                                    <div className="flex justify-between items-start mb-4">
                                        <h3 className="text-lg font-bold text-amber-900 flex items-center gap-2">
                                            <span className="bg-amber-200 text-amber-700 w-6 h-6 flex items-center justify-center rounded-full text-sm">2</span>
                                            프로젝트 목표 설정
                                        </h3>
                                        <div className="bg-amber-500 text-white px-3 py-1 rounded-lg font-bold">
                                            {result.goalSetting.score} / 20
                                        </div>
                                    </div>
                                    <p className="text-amber-800 text-sm leading-relaxed bg-white/60 p-4 rounded-xl border border-amber-100">
                                        {result.goalSetting.feedback}
                                    </p>
                                </div>

                                <div className="bg-blue-50 rounded-2xl border border-blue-200 p-6 shadow-sm hover:shadow-md transition-shadow md:col-span-2">
                                    <div className="flex justify-between items-start mb-4">
                                        <h3 className="text-lg font-bold text-blue-900 flex items-center gap-2">
                                            <span className="bg-blue-200 text-blue-700 w-6 h-6 flex items-center justify-center rounded-full text-sm">3</span>
                                            자유 아이디어 스케치
                                        </h3>
                                        <div className="bg-blue-600 text-white px-3 py-1 rounded-lg font-bold">
                                            {result.freeSketch.score} / 10
                                        </div>
                                    </div>
                                    <p className="text-blue-800 text-sm leading-relaxed bg-white/60 p-4 rounded-xl border border-blue-100">
                                        {result.freeSketch.feedback}
                                    </p>
                                </div>
                            </div>

                            <div className="bg-emerald-50 rounded-2xl border border-emerald-200 p-6 md:p-8 shadow-sm">
                                <div className="flex justify-between items-end mb-6 pb-4 border-b border-emerald-200/50">
                                    <div>
                                        <h3 className="text-xl font-bold text-emerald-900 flex items-center gap-2 mb-1">
                                            <span className="bg-emerald-200 text-emerald-700 w-6 h-6 flex items-center justify-center rounded-full text-sm">4</span>
                                            핵심 구조 체계화
                                        </h3>
                                        <p className="text-emerald-700/80 text-sm">5대 핵심 요소를 정교하게 구조화했는지 평가합니다.</p>
                                    </div>
                                    <div className="bg-emerald-600 text-white px-4 py-2 rounded-xl text-lg font-bold shadow-sm">
                                        총 {result.coreStructure.totalSubScore} / 50
                                    </div>
                                </div>

                                <div className="space-y-4">
                                    <div className="flex flex-col md:flex-row md:items-start gap-4 bg-white/70 p-4 rounded-xl border border-emerald-100">
                                        <div className="w-full md:w-32 flex-shrink-0 flex items-center justify-between md:flex-col md:items-start md:gap-2">
                                            <span className="font-semibold text-emerald-800">🎨 디자인</span>
                                            <span className="text-sm font-bold bg-emerald-100 text-emerald-700 px-2 py-1 rounded">{result.coreStructure.design.score} / 10</span>
                                        </div>
                                        <p className="text-emerald-900 text-sm flex-1">{result.coreStructure.design.feedback}</p>
                                    </div>
                                    
                                    <div className="flex flex-col md:flex-row md:items-start gap-4 bg-white/70 p-4 rounded-xl border border-emerald-100">
                                        <div className="w-full md:w-32 flex-shrink-0 flex items-center justify-between md:flex-col md:items-start md:gap-2">
                                            <span className="font-semibold text-emerald-800">📐 레이아웃</span>
                                            <span className="text-sm font-bold bg-emerald-100 text-emerald-700 px-2 py-1 rounded">{result.coreStructure.layout.score} / 10</span>
                                        </div>
                                        <p className="text-emerald-900 text-sm flex-1">{result.coreStructure.layout.feedback}</p>
                                    </div>

                                    <div className="flex flex-col md:flex-row md:items-start gap-4 bg-white/70 p-4 rounded-xl border border-emerald-100">
                                        <div className="w-full md:w-32 flex-shrink-0 flex items-center justify-between md:flex-col md:items-start md:gap-2">
                                            <span className="font-semibold text-emerald-800">👾 시각 객체</span>
                                            <span className="text-sm font-bold bg-emerald-100 text-emerald-700 px-2 py-1 rounded">{result.coreStructure.visualObjects.score} / 10</span>
                                        </div>
                                        <p className="text-emerald-900 text-sm flex-1">{result.coreStructure.visualObjects.feedback}</p>
                                    </div>

                                    <div className="flex flex-col md:flex-row md:items-start gap-4 bg-white/70 p-4 rounded-xl border border-emerald-100">
                                        <div className="w-full md:w-32 flex-shrink-0 flex items-center justify-between md:flex-col md:items-start md:gap-2">
                                            <span className="font-semibold text-emerald-800">🕹️ UI/UX 조작부</span>
                                            <span className="text-sm font-bold bg-emerald-100 text-emerald-700 px-2 py-1 rounded">{result.coreStructure.uiux.score} / 10</span>
                                        </div>
                                        <p className="text-emerald-900 text-sm flex-1">{result.coreStructure.uiux.feedback}</p>
                                    </div>

                                    <div className="flex flex-col md:flex-row md:items-start gap-4 bg-white/70 p-4 rounded-xl border border-emerald-100">
                                        <div className="w-full md:w-32 flex-shrink-0 flex items-center justify-between md:flex-col md:items-start md:gap-2">
                                            <span className="font-semibold text-emerald-800">⚙️ 핵심 로직</span>
                                            <span className="text-sm font-bold bg-emerald-100 text-emerald-700 px-2 py-1 rounded">{result.coreStructure.coreLogic.score} / 10</span>
                                        </div>
                                        <p className="text-emerald-900 text-sm flex-1">{result.coreStructure.coreLogic.feedback}</p>
                                    </div>
                                </div>
                            </div>
                        </section>
                    )}
                    
                    <style>{`
                        @keyframes fadeIn {
                            from { opacity: 0; transform: translateY(10px); }
                            to { opacity: 1; transform: translateY(0); }
                        }
                        @keyframes shimmer {
                            0% { transform: translateX(-100%); }
                            100% { transform: translateX(100%); }
                        }
                    `}</style>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
